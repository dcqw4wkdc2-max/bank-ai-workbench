<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 银行客服 AI 工作台</title>
<link rel="stylesheet" href="/assets/app.css?v=1.5.0f9">
<style>
body{background:var(--bg)}
.wrap{display:grid;grid-template-columns:minmax(320px,460px) 1fr;min-height:100vh}

/* 左侧：品牌与分区说明（官网式深藏青） */
.side{background:linear-gradient(160deg,var(--navy-3) 0%,var(--navy) 48%,var(--navy-2) 100%);color:#dce6f2;padding:48px 44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.side::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 40% at 85% 10%,rgba(211,178,94,.13),transparent 60%),
  radial-gradient(ellipse 50% 45% at 10% 95%,rgba(122,168,224,.12),transparent 65%);pointer-events:none}
.side>*{position:relative}
.side .lg{display:flex;align-items:center;gap:12px;margin-bottom:38px}
.side .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(145deg,#1d4a85,#123563);border:1px solid rgba(211,178,94,.55);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:var(--gold-2)}
.side h1{font-size:16px;font-weight:600;color:#fff;letter-spacing:.02em;line-height:1.3}
.side h1 small{display:block;font-size:11.5px;color:rgba(255,255,255,.55);font-weight:400;margin-top:3px;letter-spacing:.06em}
.side .lead{font-size:13.5px;line-height:1.85;color:#b9cbdf;max-width:330px;border-left:2px solid var(--gold);padding-left:14px}
.zline{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.zline .zd{width:8px;height:8px;border-radius:50%;background:#3fbd85;flex:none;box-shadow:0 0 0 3px rgba(63,189,133,.18)}
.zline .zd.b{background:#6fa6e0;box-shadow:0 0 0 3px rgba(111,166,224,.18)}
.zline .zd.a{background:var(--gold-2);box-shadow:0 0 0 3px rgba(211,178,94,.2)}
.zline .zt{font-size:12.5px;color:#d5e0ee}
.zline .zt em{display:block;font-style:normal;font-size:11px;color:#8ba3bf;margin-top:1px}
.side .foot{font-size:11px;color:#7f95b0;line-height:1.7;border-top:1px solid rgba(255,255,255,.12);padding-top:14px}

/* 右侧：表单 */
.formside{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.box{width:100%;max-width:376px}
.switch{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:3px;margin-bottom:26px}
.switch button{flex:1;padding:9px 10px;border-radius:7px;font-size:13px;color:var(--ink3);font-weight:500;transition:all .14s}
.switch button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(20,20,15,.07)}
.switch button:not(.on):hover{color:var(--ink2)}
.box h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-bottom:5px}
.box .sub{font-size:12.5px;color:var(--ink3);margin-bottom:24px;line-height:1.6}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--ink2);margin-bottom:6px;font-weight:500}
.fld input{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);color:var(--ink);outline:none;font-size:14px;transition:border-color .12s,box-shadow .12s}
.fld input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(23,62,107,.1)}
.submit{width:100%;padding:11px;border-radius:7px;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;font-size:14px;font-weight:600;letter-spacing:.28em;margin-top:6px;transition:all .12s;box-shadow:0 2px 8px rgba(14,47,85,.28)}
.submit:hover:not(:disabled){filter:brightness(1.12);box-shadow:0 3px 12px rgba(14,47,85,.35)}
.submit:disabled{opacity:.5;cursor:not-allowed}
.err{margin-top:14px;font-size:12.5px;color:var(--red);background:var(--red-bg);border:1px solid var(--red-line);border-radius:7px;padding:9px 12px;display:none;line-height:1.55}
.err.on{display:block}

.note{font-size:11px;color:var(--ink3);margin-top:26px;border-top:1px solid var(--line);padding-top:14px;line-height:1.65}

@media (max-width:820px){.wrap{grid-template-columns:1fr}.side{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div>
      <div class="lg">
        <div class="mark">光</div>
        <h1>银行客服 AI 工作台<small>内网可信域 · 统一身份入口</small></h1>
      </div>
      <p class="lead">AI 只提供建议，裁决权留在内网。所有客户数据在穿越边界前完成令牌化，复原须三元匹配。</p>
    </div>

    <div style="margin:34px 0">
      <div class="zline"><span class="zd"></span><span class="zt">内网可信域<em>持有原始数据、规则引擎与身份权威</em></span></div>
      <div class="zline"><span class="zd b"></span><span class="zt">DMZ 安全交换区<em>字段白名单、内容复检、签名换发</em></span></div>
      <div class="zline"><span class="zd a"></span><span class="zt">外网 AI 协同域<em>只持有算力，不持有事实</em></span></div>
    </div>

    <div class="foot">
      两个入口在登录环节分流：坐席账号进不了管理端，管理账号也进不了坐席端。<br>
      PoC 演示环境 · 请勿使用真实客户信息
    </div>
  </aside>

  <main class="formside">
    <div class="box">
      <div class="switch" id="switch">
        <button data-portal="client" class="on">坐席工作台</button>
        <button data-portal="admin">管理控制台</button>
      </div>

      <h2 id="ttl">登录坐席工作台</h2>
      <p class="sub" id="sub">处理客户咨询，查看 AI 建议与边界对照报文。</p>

      <form id="form" autocomplete="off">
        <div class="fld">
          <label for="u">账号</label>
          <input id="u" name="username" placeholder="工号账号，如 a001" autocomplete="username" required>
        </div>
        <div class="fld">
          <label for="p">口令</label>
          <input id="p" name="password" type="password" placeholder="请输入口令" autocomplete="current-password" required>
        </div>
        <button class="submit" id="go">登 录</button>
      </form>

      <div class="err" id="err"></div>

      <div class="note">账号由管理员统一发放，初始口令首次登录须修改。连续 5 次口令错误将锁定账号 300 秒，登录与越权事件全部进入审计。</div>
    </div>
  </main>
</div>

<script>
const API = '';
const COPY = {
  client:{t:'登录坐席工作台', s:'处理客户咨询，查看 AI 建议与边界对照报文。'},
  admin: {t:'登录管理控制台', s:'查看工单与审计、管理账号会话、审批规则变更。'},
};

let portal = new URLSearchParams(location.search).get('portal') === 'admin' ? 'admin' : 'client';

function paint() {
  document.querySelectorAll('#switch button').forEach(b => b.classList.toggle('on', b.dataset.portal === portal));
  document.getElementById('ttl').textContent = COPY[portal].t;
  document.getElementById('sub').textContent = COPY[portal].s;
}

document.querySelectorAll('#switch button').forEach(b => b.onclick = () => {
  portal = b.dataset.portal;
  history.replaceState(null, '', portal === 'admin' ? '/login?portal=admin' : '/login');
  paint();
});
paint();

const err = document.getElementById('err');
function showErr(msg) { err.textContent = msg; err.classList.add('on'); }

// 掉线原因提示：工作台 401 跳回时携带 ?reason=expire（含被其他设备顶下线的情况）
(function () {
  const reason = new URLSearchParams(location.search).get('reason');
  if (reason === 'expire') showErr('登录状态已失效（长时间未操作，或该账号刚在其他设备登录），请重新登录');
})();

document.getElementById('form').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const username = document.getElementById('u').value.trim();
  const password = document.getElementById('p').value;
  if (!username || !password) return showErr('请填写账号与口令');
  btn.disabled = true; btn.textContent = '验证中…';
  err.classList.remove('on');
  try {
    const r = await fetch(`${API}/internal/api/v1/auth/login`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({username, password, portal}),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || '登录失败');
    // 首登强制改密：先到改密页，完成后由该页送回对应工作台
    if (d.user && d.user.must_change_pwd) { location.href = '/change-password'; return; }
    location.href = portal === 'client' ? '/client' : '/admin';
  } catch (ex) {
    showErr(ex.message);
    btn.disabled = false; btn.textContent = '登 录';
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改口令 · 内网可信域</title>
<link rel="stylesheet" href="/assets/app.css?v=1.5.0">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="mark">光</div>
    <h1>修改口令</h1>
    <span>内网可信域 · 账号安全</span>
  </div>
  <div class="zones">
    <div class="who" style="margin-left:8px;padding-left:16px;border-left:1px solid rgba(255,255,255,.22)">
      <span class="nm" id="me-name">—</span>
      <button class="linkbtn" id="logout">退出登录</button>
    </div>
  </div>
</div>

<main style="max-width:520px">
  <div class="card">
    <div class="card-h"><h2>账号安全</h2><span class="muted" id="policy-tag">—</span></div>
    <div class="card-b">
      <div class="warnbox" id="force-box" hidden style="margin-bottom:14px">
        <b>首次登录或口令被重置：</b>必须设置新口令后才能进入工作台。新口令请妥善保管，不要转告他人。
      </div>
      <form id="form" autocomplete="off">
        <div class="field">
          <label>当前口令</label>
          <input id="old" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label>新口令（至少 8 位，须同时包含字母与数字）</label>
          <input id="n1" type="password" autocomplete="new-password" required>
        </div>
        <div class="field">
          <label>确认新口令</label>
          <input id="n2" type="password" autocomplete="new-password" required>
        </div>
        <div class="btn-row">
          <button class="btn primary" id="go" type="submit">确认修改</button>
          <button class="btn ghost" type="button" id="cancel">取消</button>
        </div>
        <div class="hint" id="msg">修改成功后，其它已登录的会话将全部失效（单会话互踢策略保留当前会话）。</div>
      </form>
    </div>
  </div>
</main>

<script>
const API = '';
const $ = s => document.querySelector(s);
let me = null;

async function boot() {
  const r = await fetch(`${API}/internal/api/v1/auth/me`, {credentials: 'same-origin'});
  if (!r.ok) { location.href = '/login'; return; }
  me = await r.json();
  $('#me-name').innerHTML = `${me.name}<span class="emp">（${me.emp_id}）</span>`;
  $('#policy-tag').textContent = me.must_change_pwd ? '状态：必须修改' : '状态：常规修改';
  $('#force-box').hidden = !me.must_change_pwd;
  $('#cancel').onclick = () => {
    if (me.must_change_pwd) { location.href = '/login'; return; }
    location.href = me.portal === 'client' ? '/client' : '/admin';
  };
}

$('#logout').onclick = async () => {
  await fetch(`${API}/internal/api/v1/auth/logout`, {method: 'POST', credentials: 'same-origin'});
  location.href = '/login';
};

$('#form').onsubmit = async (e) => {
  e.preventDefault();
  const msg = $('#msg'), btn = $('#go');
  msg.className = 'hint'; msg.style.color = '';
  if ($('#n1').value !== $('#n2').value) { msg.textContent = '两次输入的新口令不一致'; msg.style.color = '#a32d2d'; return; }
  btn.disabled = true; btn.textContent = '提交中…';
  try {
    const r = await fetch(`${API}/internal/api/v1/auth/password`, {
      method: 'POST', headers: {'Content-Type': 'application/json'}, credentials: 'same-origin',
      body: JSON.stringify({old_password: $('#old').value, new_password: $('#n1').value}),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.detail || '修改失败');
    msg.textContent = '口令已更新，正在进入工作台…';
    msg.style.color = '#0f6e56';
    setTimeout(() => { location.href = me.portal === 'client' ? '/client' : '/admin'; }, 600);
  } catch (ex) {
    msg.textContent = ex.message;
    msg.style.color = '#a32d2d';
    btn.disabled = false; btn.textContent = '确认修改';
  }
};

boot();
</script>
</body>
</html>
